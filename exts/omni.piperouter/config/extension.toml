[package]
version = "0.5.0"
title = "PipeRouter - Accelerated 3D Routing"
description = "GPU-accelerated, constraint-aware 3D routing of cables and pipes in automotive USD scenes. Voxelizes the stage with NVIDIA Warp and solves routes with NVIDIA cuGraph shortest paths."
category = "Simulation"
keywords = ["routing", "cables", "pipes", "harness", "usd", "cugraph", "warp"]
authors = ["NVIDIA"]

[dependencies]
"omni.ui" = {}
"omni.usd" = {}
# Warp is used for in-process voxelization; optional so the extension still loads
# (and reports a clear error on Route) in an app where Warp isn't present.
"omni.warp.core" = { optional = true }

[[python.module]]
name = "omni.piperouter"
