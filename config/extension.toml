[package]
title = "cuOpt Pipe Router"
version = "1.0.0"
description = "3D pipe routing with obstacle avoidance. Voxelizes scene geometry with Warp on GPU, routes pipes with cuOpt, and generates tube meshes."
category = "Simulation"
keywords = ["cuopt", "routing", "optimization", "pipe", "pathfinding"]

[dependencies]
"omni.kit.uiapp" = {}
"omni.usd" = {}
"omni.warp" = {}

[[python.module]]
name = "omni.cuopt"

[[test]]
dependencies = [
    "omni.kit.test",
]
