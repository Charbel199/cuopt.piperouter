<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PipeRouter Architecture - NVIDIA Blueprint</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    padding: 24px;
  }
  .diagram-wrapper {
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 16px;
    background: #0a0a0a;
    padding: 20px;
    box-shadow: 0 0 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.06) inset;
  }
  h1 {
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 12px;
  }
  svg text {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  /* Pulse animation on main HTTP arrow */
  @keyframes pulse-travel {
    0%   { offset-distance: 0%;   opacity: 1; }
    90%  { opacity: 1; }
    100% { offset-distance: 100%; opacity: 0; }
  }
  .pulse-dot {
    width: 7px;
    height: 7px;
    background: #ffffff;
    border-radius: 50%;
    position: absolute;
    box-shadow: 0 0 8px #fff, 0 0 16px rgba(255,255,255,0.6);
    offset-path: path("M 200 310 L 730 180");
    animation: pulse-travel 2.2s linear infinite;
  }
  @keyframes pulse-travel2 {
    0%   { offset-distance: 0%;   opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { offset-distance: 100%; opacity: 0; }
  }

  /* SVG inline animations */
  .anim-dot {
    animation: pulse-travel 2.2s linear infinite;
  }
</style>
</head>
<body>
<div class="diagram-wrapper">
  <h1>PipeRouter - Architecture Blueprint</h1>
  <svg width="1250" height="780" viewBox="0 0 1250 780" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Arrow markers -->
      <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" fill="#888888"/>
      </marker>
      <marker id="arr-white" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" fill="#cccccc"/>
      </marker>
      <marker id="arr-bright" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L0,9 L9,4.5 z" fill="#ffffff"/>
      </marker>
      <marker id="arr-dashed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" fill="#888888"/>
      </marker>

      <!-- Clip paths for group labels -->
      <style>
        .group-label { font-size: 10px; letter-spacing: 0.12em; fill: rgba(255,255,255,0.45); text-transform: uppercase; font-weight: 500; }
        .comp-label  { font-size: 11px; fill: rgba(255,255,255,0.88); text-anchor: middle; font-weight: 400; }
        .comp-label-sm { font-size: 10px; fill: rgba(255,255,255,0.65); text-anchor: middle; }
        .arrow-label { font-size: 9px; fill: rgba(255,255,255,0.55); font-weight: 400; }
        .badge-gpu { font-size: 8px; fill: #ff9800; font-weight: 700; }
        .badge-cpu { font-size: 8px; fill: #00bcd4; font-weight: 700; }
      </style>

      <!-- Animated pulse circle along HTTP arrow -->
      <circle id="http-pulse" r="4" fill="white" opacity="0.9">
        <animateMotion dur="2.2s" repeatCount="indefinite"
          path="M 200 310 C 350 280, 580 230, 730 180">
          <mKeyTimes values="0;1"/>
        </animateMotion>
      </circle>
    </defs>

    <!-- ════════════════════════════════════════
         BACKGROUND GROUPS
    ═════════════════════════════════════════ -->

    <!-- Group 2: NVIDIA Omniverse Kit -->
    <rect x="50" y="120" width="490" height="480"
          rx="12" ry="12"
          fill="rgba(20,40,20,0.18)" stroke="rgba(118,185,0,0.25)" stroke-width="1"/>
    <text x="68" y="140" class="group-label">NVIDIA Omniverse Kit</text>

    <!-- Group 3: Shared Memory -->
    <rect x="548" y="295" width="130" height="130"
          rx="10" ry="10"
          fill="rgba(30,20,50,0.35)" stroke="rgba(156,39,176,0.35)" stroke-width="1"/>
    <text x="562" y="312" class="group-label" style="font-size:9px">/dev/shm</text>

    <!-- Group 4: Solver Container -->
    <rect x="670" y="120" width="530" height="480"
          rx="12" ry="12"
          fill="rgba(20,20,40,0.20)" stroke="rgba(80,120,220,0.22)" stroke-width="1"/>
    <text x="688" y="140" class="group-label">Solver Container · Docker + GPU</text>

    <!-- Group 5: Output -->
    <rect x="185" y="620" width="760" height="120"
          rx="12" ry="12"
          fill="rgba(20,30,20,0.20)" stroke="rgba(100,200,100,0.20)" stroke-width="1"/>
    <text x="202" y="638" class="group-label">Output</text>


    <!-- ════════════════════════════════════════
         ARROWS  (draw before icons so icons sit on top)
    ═════════════════════════════════════════ -->

    <!-- Engineer → Panel UI (down) -->
    <line x1="100" y1="100" x2="120" y2="165"
          stroke="#888" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- Panel UI → RouterSession (down) -->
    <line x1="120" y1="215" x2="185" y2="293"
          stroke="#888" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- USD Stage → RouterSession (diagonal) -->
    <line x1="270" y1="215" x2="215" y2="293"
          stroke="#888" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- Wire Types → RouterSession -->
    <line x1="430" y1="215" x2="225" y2="293"
          stroke="#888" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- RouterSession → Warp Voxelizer (right) -->
    <line x1="245" y1="310" x2="345" y2="310"
          stroke="#888" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- Warp Voxelizer → GridStack (right, labeled) -->
    <line x1="425" y1="310" x2="565" y2="345"
          stroke="#888" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <text x="452" y="320" class="arrow-label">save stack.npz</text>

    <!-- GridStack → FilesystemStore (right, labeled) -->
    <line x1="630" y1="345" x2="1045" y2="205"
          stroke="#888" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <text x="755" y="265" class="arrow-label">load grids</text>

    <!-- RouterSession → FastAPI (main HTTP, prominent white) -->
    <path d="M 220 295 C 350 260, 580 220, 715 195"
          fill="none" stroke="#ffffff" stroke-width="2" marker-end="url(#arr-bright)"/>
    <text x="430" y="248" class="arrow-label" style="fill:rgba(255,255,255,0.8);font-size:10px">HTTP /solve_all</text>

    <!-- Animated pulse on HTTP arrow -->
    <circle r="4.5" fill="white" opacity="0.95" filter="url(#glow-white)">
      <animateMotion dur="2.2s" repeatCount="indefinite"
        path="M 220 295 C 350 260, 580 220, 715 195"/>
    </circle>

    <!-- FastAPI → Lattice Builder (down) -->
    <line x1="730" y1="215" x2="730" y2="293"
          stroke="#888" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- FilesystemStore → Lattice Builder (down-left) -->
    <line x1="1050" y1="215" x2="775" y2="293"
          stroke="#888" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- Lattice Builder → cuGraph SSSP (right, labeled) -->
    <line x1="785" y1="310" x2="895" y2="310"
          stroke="#888" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <text x="800" y="303" class="arrow-label">edges + weights</text>

    <!-- cuGraph SSSP → Smoothing (right, labeled) -->
    <line x1="985" y1="310" x2="1057" y2="310"
          stroke="#888" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <text x="993" y="303" class="arrow-label">cell path</text>

    <!-- cuGraph SSSP → Bundle Router (down) -->
    <line x1="930" y1="345" x2="855" y2="430"
          stroke="#888" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- Smoothing → FastAPI (curved return, labeled) -->
    <path d="M 1065 290 C 1020 230, 900 200, 790 192"
          fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"
          marker-end="url(#arr-dashed)"/>
    <text x="940" y="222" class="arrow-label">polyline + cells</text>

    <!-- FastAPI → RouterSession (left return, dashed, labeled) -->
    <path d="M 715 190 C 580 215, 360 265, 245 305"
          fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"
          marker-end="url(#arr-dashed)"/>
    <text x="430" y="272" class="arrow-label" style="fill:rgba(200,200,200,0.55)">JSON results</text>

    <!-- RouterSession → scene_ops (down-left) -->
    <line x1="175" y1="340" x2="128" y2="430"
          stroke="#888" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- scene_ops → Routed Tubes (down) -->
    <line x1="128" y1="480" x2="245" y2="635"
          stroke="#888" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- RouterSession → Viewport Labels (down) -->
    <line x1="200" y1="340" x2="265" y2="430"
          stroke="#888" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- RouterSession → Slices 2D (down-right) -->
    <line x1="225" y1="340" x2="410" y2="430"
          stroke="#888" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- Bundle Router → Diagnose (right) -->
    <line x1="885" y1="450" x2="992" y2="450"
          stroke="#888" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- Diagnose → FastAPI (up, dashed, labeled) -->
    <line x1="1020" y1="428" x2="770" y2="215"
          stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"
          marker-end="url(#arr-dashed)"/>
    <text x="908" y="330" class="arrow-label">reason</text>


    <!-- ════════════════════════════════════════
         ICONS & COMPONENTS
    ═════════════════════════════════════════ -->

    <!-- === ENGINEER (top-left) === -->
    <g transform="translate(100, 60)">
      <circle cx="0" cy="0" r="22" fill="#003a5c" stroke="#00b0ff" stroke-width="1.5"/>
      <!-- person silhouette -->
      <circle cx="0" cy="-6" r="6" fill="#00b0ff"/>

      <text x="0" y="46" class="comp-label">Engineer</text>
    </g>


    <!-- === PANEL UI (flat orange, monitor icon) === -->
    <g transform="translate(120, 180)">
      <rect x="-22" y="-22" width="44" height="44" rx="7" fill="#c04400"/>

    </g>

    <!-- === USD STAGE (flat orange, file icon) === -->
    <g transform="translate(280, 180)">
      <rect x="-22" y="-22" width="44" height="44" rx="7" fill="#c04400"/>
      <!-- file with folded corner -->
      <polygon points="-12,-16 8,-16 14,-10 14,16 -12,16" fill="white" opacity="0.85"/>
      <polygon points="8,-16 14,-10 8,-10" fill="#c04400" opacity="0.9"/>
      <line x1="-7" y1="-4" x2="9" y2="-4" stroke="#c04400" stroke-width="1.5"/>
      <line x1="-7" y1="2"  x2="9"  y2="2"  stroke="#c04400" stroke-width="1.5"/>
      <line x1="-7" y1="8"  x2="9"  y2="8"  stroke="#c04400" stroke-width="1.5"/>
      <text x="0" y="34" class="comp-label">USD Stage</text>
    </g>

    <!-- === WIRE TYPES JSON (flat yellow, JSON icon) === -->
    <g transform="translate(440, 180)">
      <rect x="-22" y="-22" width="44" height="44" rx="7" fill="#b57820"/>
      <!-- JSON curly braces hint -->
      <text x="0" y="6" text-anchor="middle" font-size="22" font-weight="700" fill="white" opacity="0.9">{}</text>
      <text x="0" y="34" class="comp-label">Wire Types</text>
    </g>

    <!-- === ROUTER SESSION (3D green NIM cube) === -->
    <g transform="translate(200, 310)">
      <!-- Top face -->
      <polygon points="0,-28 28,-14 0,0 -28,-14" fill="#76b900"/>
      <!-- Right face -->
      <polygon points="0,0 28,-14 28,14 0,28" fill="#4a7a00"/>
      <!-- Left face -->
      <polygon points="-28,-14 0,0 0,28 -28,14" fill="#2d4d00"/>
      <!-- Neural net dots on right face -->
      <circle cx="10" cy="2"  r="2.5" fill="rgba(255,255,255,0.5)"/>
      <circle cx="20" cy="-4" r="2.5" fill="rgba(255,255,255,0.5)"/>
      <circle cx="18" cy="10" r="2.5" fill="rgba(255,255,255,0.5)"/>
      <circle cx="8"  cy="15" r="2.5" fill="rgba(255,255,255,0.5)"/>
      <line x1="10" y1="2"  x2="20" y2="-4" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <line x1="20" y1="-4" x2="18" y2="10" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <line x1="18" y1="10" x2="8"  y2="15" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <line x1="10" y1="2"  x2="18" y2="10" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="0" y="44" class="comp-label">Router</text>
      <text x="0" y="56" class="comp-label">Session</text>
    </g>

    <!-- === WARP VOXELIZER (3D orange NIM cube) === -->
    <g transform="translate(385, 310)">
      <polygon points="0,-28 28,-14 0,0 -28,-14" fill="#ff9800"/>
      <polygon points="0,0 28,-14 28,14 0,28" fill="#b36a00"/>
      <polygon points="-28,-14 0,0 0,28 -28,14" fill="#7a4800"/>
      <circle cx="10" cy="2"  r="2.5" fill="rgba(255,255,255,0.5)"/>
      <circle cx="20" cy="-4" r="2.5" fill="rgba(255,255,255,0.5)"/>
      <circle cx="18" cy="10" r="2.5" fill="rgba(255,255,255,0.5)"/>
      <circle cx="8"  cy="15" r="2.5" fill="rgba(255,255,255,0.5)"/>
      <line x1="10" y1="2"  x2="20" y2="-4" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <line x1="20" y1="-4" x2="18" y2="10" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <line x1="18" y1="10" x2="8"  y2="15" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <text x="0" y="44" class="comp-label">Warp</text>
      <text x="0" y="56" class="comp-label">Voxelizer</text>
      <!-- GPU badge -->
      <rect x="-13" y="60" width="26" height="13" rx="6" fill="rgba(255,152,0,0.25)" stroke="rgba(255,152,0,0.7)" stroke-width="0.8"/>
      <text x="0" y="70" class="badge-gpu" text-anchor="middle">GPU</text>
    </g>

    <!-- === SCENE OPS / USD AUTHORING (flat purple) === -->
    <g transform="translate(120, 450)">
      <rect x="-22" y="-22" width="44" height="44" rx="7" fill="#5c1f99"/>
      <!-- USD icon: simple U shape -->
      <text x="0" y="7" text-anchor="middle" font-size="18" font-weight="700" fill="white" opacity="0.9">U</text>
      <text x="0" y="34" class="comp-label">USD</text>
      <text x="0" y="46" class="comp-label">Authoring</text>
    </g>

    <!-- === VIEWPORT LABELS (flat orange, eye icon) === -->
    <g transform="translate(280, 450)">
      <rect x="-22" y="-22" width="44" height="44" rx="7" fill="#c04400"/>

      <text x="0" y="34" class="comp-label">Debug</text>
      <text x="0" y="46" class="comp-label">Views</text>
    </g>

    <!-- === SLICES 2D (flat orange, chart icon) === -->
    <g transform="translate(440, 450)">
      <rect x="-22" y="-22" width="44" height="44" rx="7" fill="#c04400"/>
      <!-- bar chart -->
      <rect x="-13" y="2"  width="7" height="12" fill="white" opacity="0.85"/>
      <rect x="-3"  y="-8" width="7" height="22" fill="white" opacity="0.85"/>

      <text x="0" y="46" class="comp-label">Sections</text>
    </g>


    <!-- === GRIDSTACK (3D purple cube, shared mem) === -->

      <polygon points="0,-26 26,-13 0,0 -26,-13" fill="#9c27b0"/>
      <polygon points="0,0 26,-13 26,13 0,26" fill="#6a1b9a"/>

      <line x1="-12" y1="4"   x2="12" y2="4"   stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
      <text x="0" y="40" class="comp-label">GridStack</text>
      <text x="0" y="52" class="comp-label" style="font-size:9px;fill:rgba(255,255,255,0.45)">stack.npz</text>
      <text x="0" y="62" class="comp-label" style="font-size:8px;fill:rgba(255,255,255,0.35)">occ · sd · thermal · em</text>
    </g>


    <!-- === FASTAPI (flat orange, server icon) === -->
    <g transform="translate(730, 180)">
      <rect x="-22" y="-22" width="44" height="44" rx="7" fill="#c04400"/>
      <!-- stacked server rects -->
      <rect x="-13" y="-14" width="26" height="7" rx="2" fill="white" opacity="0.85"/>

      <text x="0" y="34" class="comp-label">FastAPI</text>
      <text x="0" y="46" class="comp-label">/solve_all</text>

    <!-- === WIRE CATALOG (flat yellow) === -->

      <rect x="-22" y="-22" width="44" height="44" rx="7" fill="#b57820"/>
      <!-- list lines -->
      <line x1="-12" y1="-10" x2="12" y2="-10" stroke="white" stroke-width="2" opacity="0.85"/>
      <line x1="-12" y1="-2"  x2="12" y2="-2"  stroke="white" stroke-width="2" opacity="0.85"/>

    <!-- === FILESYSTEM STORE (flat purple, folder icon) === -->

      <rect x="-22" y="-22" width="44" height="44" rx="7" fill="#5c1f99"/>

    <!-- === LATTICE BUILDER (3D green NIM cube) === -->
    <g transform="translate(730, 315)">
      <polygon points="0,-28 28,-14 0,0 -28,-14" fill="#76b900"/>
      <polygon points="0,0 28,-14 28,14 0,28" fill="#4a7a00"/>

      <circle cx="18" cy="10" r="2.5" fill="rgba(255,255,255,0.5)"/>
      <circle cx="8"  cy="15" r="2.5" fill="rgba(255,255,255,0.5)"/>

    <!-- === cuGRAPH SSSP (3D green NIM cube) === -->
    <g transform="translate(935, 315)">
      <polygon points="0,-28 28,-14 0,0 -28,-14" fill="#76b900"/>
